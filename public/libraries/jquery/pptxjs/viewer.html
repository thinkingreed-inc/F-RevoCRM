<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PowerPoint Preview</title>
<link rel="stylesheet" href="css/pptxjs.css">
<link rel="stylesheet" href="css/nv.d3.min.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: auto; background: #f0f0f0; }
  #loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #A0AEC0; font-family: sans-serif; font-size: 14px; }
  #error { display: none; padding: 40px; text-align: center; color: #E53E3E; font-family: sans-serif; }
  #result { padding: 10px; }
  #result .slide { margin: 10px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.15); background: #fff; }
</style>
</head>
<body>
<div id="loading">読み込み中...</div>
<div id="error"></div>
<div id="result"></div>

<!-- 文言は F-RevoCRM の言語ファイルから取得する（ライブラリ本体は変更しない） -->
<script src="../../../resources/preview-i18n.js"></script>
<script src="../jquery.min.js"></script>
<script src="js/jszip.min.js"></script>
<script src="js/filereader.js"></script>
<script src="js/d3.min.js"></script>
<script src="js/nv.d3.min.js"></script>
<script src="js/dingbat.js"></script>
<script src="js/pptxjs.min.js"></script>
<script src="js/divs2slides.min.js"></script>
<script>
(function() {
  var finished = false;

  // 読み込み中の表示も翻訳する（取得できるまでは既定の日本語を出す）
  PreviewI18n.apply('#loading', 'LBL_PREVIEW_LOADING', '読み込み中...');

  var params = new URLSearchParams(window.location.search);
  var fileUrl = params.get('file');
  if (!fileUrl) {
    showError('LBL_PREVIEW_FILE_URL_REQUIRED', 'ファイルURLが指定されていません');
    return;
  }

  // ライブラリ内部の非同期エラーは throw されないため、window 経由でも拾う
  window.addEventListener('error', function() {
    showError('LBL_PREVIEW_PPTX_PARSE_FAILED', 'PowerPointファイルを読み込めませんでした。ファイルが壊れている可能性があります。');
  });
  window.addEventListener('unhandledrejection', function() {
    showError('LBL_PREVIEW_PPTX_PARSE_FAILED', 'PowerPointファイルを読み込めませんでした。ファイルが壊れている可能性があります。');
  });

  try {
    document.getElementById('loading').style.display = 'none';
    $("#result").pptxToHtml({
      pptxFileUrl: fileUrl,
      slideMode: false,
      mediaProcess: true
    });
  } catch(e) {
    showError('LBL_PREVIEW_PPTX_PARSE_FAILED', 'PowerPointファイルを読み込めませんでした。ファイルが壊れている可能性があります。');
  }

  /**
   * エラーを表示する
   *
   * @param {string} key 翻訳キー
   * @param {string} fallback 翻訳が取得できない場合の文言
   */
  function showError(key, fallback) {
    if (finished) return;
    finished = true;
    document.getElementById('loading').style.display = 'none';
    var el = document.getElementById('error');
    // 先にフォールバックを出し、翻訳が取れたら差し替える
    el.textContent = fallback || key;
    el.style.display = 'block';
    PreviewI18n.text(key, fallback).then(function(message) {
      el.textContent = message;
    });
  }
})();
</script>
</body>
</html>
